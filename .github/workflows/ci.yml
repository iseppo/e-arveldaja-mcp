name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata
        run: npm run validate:release

      - name: Build
        run: npm run build

      - name: Typecheck tests (ratchet)
        run: npm run typecheck:tests

      - name: Report MCP surface sizes and deltas
        run: npm run measure:surface

      - name: Report response fixture sizes and deltas
        run: npm run measure:responses

      - name: Unit tests
        run: npm test

      # The lost-value image test OCRs with liteparse's Tesseract, which downloads
      # eng+est traineddata (~31 MB) into TESSDATA_PREFIX on first use.
      - name: Resolve liteparse version
        id: liteparse
        run: echo "version=$(node -p "require('@llamaindex/liteparse/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Tesseract traineddata
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/tessdata
          key: tessdata-eng-est-liteparse-${{ steps.liteparse.outputs.version }}

      - name: Integration surface tests
        env:
          TESSDATA_PREFIX: ${{ runner.temp }}/tessdata
        run: |
          mkdir -p "$TESSDATA_PREFIX"
          npm run test:integration

  package-smoke-node18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm run smoke:package
