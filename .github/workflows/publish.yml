name: Publish

# Publishes a stable release tag (vX.Y.Z) to npm and the MCP registry without
# stored tokens: npm via Trusted Publishing (OIDC; configured once on npmjs.com
# for this workflow file) and the MCP registry via `mcp-publisher login
# github-oidc` (namespace io.github.iseppo/*). Runs on a pushed tag; to rerun
# for an existing tag that contains this workflow, dispatch it ON the tag so
# the provenance names the published commit:
#   gh workflow run publish.yml --ref vX.Y.Z
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false
  queue: max

env:
  MCP_SERVER_NAME: io.github.iseppo/e-arveldaja-mcp
  MCP_PUBLISHER_VERSION: "1.8.1"
  MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Only a stable release tag is published
        env:
          REF: ${{ github.ref }}
        run: |
          if ! [[ "$REF" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Run this workflow on a stable release tag vX.Y.Z (got $REF); prereleases are not published here."
            exit 1
          fi
          echo "VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"

      - name: Check out the tag
        uses: actions/checkout@v7

      - name: Checkout must be the commit the run was triggered for
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: npm install -g npm@^11.5.1

      - name: Tag must match package and server versions
        run: |
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          test "$(jq -r .version server.json)" = "$VERSION"
          test "$(jq -r .name server.json)" = "$MCP_SERVER_NAME"

      - name: Install dependencies
        run: npm ci

      - name: Release gate
        run: npm run release:check

      - name: Publish to npm (skipped when this version is already published)
        run: |
          if out=$(npm view "e-arveldaja-mcp@$VERSION" version --json 2>&1); then
            echo "e-arveldaja-mcp@$VERSION is already on npm ($out); skipping."
          elif grep -q "E404" <<<"$out"; then
            npm publish --ignore-scripts
          else
            echo "::error::npm lookup failed: $out"
            exit 1
          fi

      # The MCP registry validates the package against npm, and a fresh
      # publish takes a few minutes to become visible there.
      - name: Wait until npm serves this version
        timeout-minutes: 12
        run: |
          for attempt in $(seq 1 40); do
            if served=$(npm view --prefer-online --json=false --fetch-timeout=20000 --fetch-retries=0 "e-arveldaja-mcp@$VERSION" version 2>/dev/null) \
              && [ "$served" = "$VERSION" ]; then exit 0; fi
            sleep 15
          done
          echo "::error::e-arveldaja-mcp@$VERSION did not appear on npm within 10 minutes"
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Publish to the MCP registry (skipped when this version is already listed)
        run: |
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://registry.modelcontextprotocol.io/v0/servers/${MCP_SERVER_NAME//\//%2F}/versions/$VERSION")
          case "$status" in
            200) echo "$MCP_SERVER_NAME $VERSION is already in the MCP registry; skipping." ;;
            404) ./mcp-publisher login github-oidc && ./mcp-publisher publish ;;
            *) echo "::error::MCP registry lookup returned HTTP $status"; exit 1 ;;
          esac
